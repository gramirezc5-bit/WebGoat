
name: SonarQube Cloud Analysis - WebGoat

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  sonarcloud:
    name: Analisis estatico WebGoat
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar y analizar con Maven
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B -ntp
          -DskipTests
          -Dsonar.projectKey=gramirezc5-bit_WebGoat
          -Dsonar.organization=gramirezc5-bit
          -Dsonar.host.url=https://sonarcloud.io
          verify sonar:sonar
